<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="مانكينو — عارضات أزياء بالذكاء الاصطناعي لمتاجر الملابس">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>مانكينو — عارضات أزياء بالذكاء الاصطناعي</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="القائمة">☰</button>
      <div class="brand">
        <span class="brand-mark">♟</span>
        <span>مانكينو</span>
      </div>
      <button class="icon-btn" aria-label="الحساب">♙</button>
    </header>

    <main>
      <section class="hero">
        <div class="hero-glow"></div>
        <h1>حوّل ملابسك إلى<br><span>صور وفيديوهات احترافية</span></h1>
        <p>اختر صورة، اكتب فكرتك، ودع الذكاء الاصطناعي يصنع لك محتوى جاهزًا لمتجرك.</p>
      </section>

      <section class="quick-actions">
        <button class="action-card video" id="videoBtn">
          <span class="action-icon">▶</span>
          <strong>توليد فيديو</strong>
          <small>حوّل الصورة إلى فيديو</small>
        </button>
        <button class="action-card image" id="imageBtn">
          <span class="action-icon">✦</span>
          <strong>توليد صورة</strong>
          <small>اصنع صورة أزياء جديدة</small>
        </button>
        <button class="action-card models" id="modelsBtn">
          <span class="action-icon">♙</span>
          <strong>عارضات الأزياء</strong>
          <small>اختر عارضة مناسبة</small>
        </button>
      </section>

      <section class="workspace">
        <div class="section-title">
          <h2>إنشاء محتوى</h2>
          <span id="selectedStatus">لم يتم اختيار صورة</span>
        </div>

        <label class="upload-box" for="imageInput">
          <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp">
          <div id="uploadEmpty">
            <div class="upload-icon">↑</div>
            <strong>اختر صورة الملابس</strong>
            <span>اضغط هنا لاختيار صورة من هاتفك</span>
            <small>JPG · PNG · WEBP</small>
          </div>
          <img id="preview" alt="معاينة الصورة" hidden>
        </label>

        <div class="prompt-wrap">
          <label for="prompt">وصف ما تريد</label>
          <textarea id="prompt" maxlength="500" placeholder="مثال: عارضة أزياء ترتدي هذا الفستان داخل متجر ملابس فاخر، إضاءة طبيعية وحركة كاميرا احترافية..."></textarea>
          <span id="counter">0/500</span>
        </div>

        <div class="mode-row">
          <button class="mode active" data-mode="image">🖼️ توليد صورة</button>
          <button class="mode" data-mode="video">🎬 توليد فيديو</button>
        </div>

        <button class="generate" id="generateBtn">
          <span>✦</span> ابدأ التوليد
        </button>
        <p class="note">الواجهة جاهزة الآن. سيتم ربط التوليد بمحرك الذكاء الاصطناعي في المرحلة التالية.</p>
      </section>

      <section class="models-section">
        <div class="section-title">
          <h2>عارضات مقترحة</h2>
          <button id="allModels">عرض الكل</button>
        </div>
        <div class="model-grid">
          <button class="model-card" data-model="سارة">
            <div class="model-avatar avatar1">س</div>
            <strong>سارة</strong><small>مظهر عصري</small>
          </button>
          <button class="model-card" data-model="ليلى">
            <div class="model-avatar avatar2">ل</div>
            <strong>ليلى</strong><small>ستايل كلاسيكي</small>
          </button>
          <button class="model-card" data-model="دينا">
            <div class="model-avatar avatar3">د</div>
            <strong>دينا</strong><small>إطلالة عصرية</small>
          </button>
          <button class="model-card" data-model="نور">
            <div class="model-avatar avatar4">ن</div>
            <strong>نور</strong><small>محجبة أنيقة</small>
          </button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active">⌂<span>الرئيسية</span></button>
      <button class="nav-item" id="galleryBtn">▣<span>معرضي</span></button>
      <button class="nav-item">♡<span>المفضلة</span></button>
      <button class="nav-item">♙<span>حسابي</span></button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
