<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b18">
  <meta name="description" content="مانكينو — توليد صور وفيديوهات أزياء بالذكاء الاصطناعي">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>مانكينو AI</title>
</head>
<body>
  <div class="bg"></div>
  <main class="app">
    <header>
      <div>
        <div class="brand">مانكينو <span>AI</span></div>
        <div class="sub">استوديو الأزياء بالذكاء الاصطناعي</div>
      </div>
      <div class="status" id="status">جاهز</div>
    </header>

    <section class="hero">
      <h1>حوّل صورة الملابس إلى<br><strong>مشهد أزياء احترافي</strong></h1>
      <p>صورة فاخرة أو فيديو عمودي جاهز للنشر.</p>
    </section>

    <section class="card">
      <label class="label">1 — صورة الملابس / الموديل</label>
      <div class="upload" id="drop">
        <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp">
        <div class="uploadIcon">＋</div>
        <b id="fileName">اضغط لاختيار صورة</b>
        <small>PNG / JPG / WEBP</small>
      </div>
      <img id="preview" class="preview hidden" alt="preview">
    </section>

    <section class="card">
      <label class="label">2 — اختر المحرك</label>
      <div class="chips">
        <button class="chip active" data-image-model="gemini-3-pro-image">🍌 Nano Banana Pro</button>
        <button class="chip" data-image-model="gemini-3.1-flash-image">🍌 Nano Banana 2</button>
      </div>
    </section>

    <section class="card">
      <label class="label">3 — وصف المشهد</label>
      <textarea id="prompt" placeholder="مثال: عارضة أزياء بالغة ترتدي هذا الفستان داخل متجر أزياء فاخر، إضاءة استوديو ناعمة، مظهر واقعي، حركة طبيعية للقماش، تصوير سينمائي..."></textarea>
    </section>

    <section class="card">
      <label class="label">4 — الفيديو</label>
      <div class="chips">
        <button class="chip videoChip active" data-video-model="veo-3.1-generate-preview">🎬 Veo 3.1</button>
        <button class="chip videoChip" data-video-model="gemini-omni-1.1-flash">⚡ Gemini Omni Flash</button>
      </div>
      <div class="options">
        <select id="ratio">
          <option value="9:16">عمودي 9:16</option>
          <option value="16:9">أفقي 16:9</option>
        </select>
        <select id="resolution">
          <option value="720p">720p</option>
          <option value="1080p">1080p</option>
        </select>
      </div>
    </section>

    <div class="actions">
      <button id="imageBtn" class="primary">✨ توليد صورة</button>
      <button id="videoBtn" class="secondary">🎬 توليد فيديو</button>
    </div>

    <section class="card resultCard hidden" id="resultCard">
      <div class="resultHead">
        <label class="label">النتيجة</label>
        <button id="saveBtn" class="mini">حفظ</button>
      </div>
      <img id="resultImage" class="resultMedia hidden" alt="generated image">
      <video id="resultVideo" class="resultMedia hidden" controls playsinline></video>
      <a id="downloadBtn" class="download hidden" download>⬇ تنزيل النتيجة</a>
    </section>

    <footer>مانكينو AI • المفتاح يبقى في الخادم ولا يوضع داخل GitHub Pages</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
